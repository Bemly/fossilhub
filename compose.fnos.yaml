name: fossilhub

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FOSSILHUB_REVISION: ${FOSSILHUB_REVISION:-unknown}
    image: fossilhub:0.2.0-beta.1
    container_name: fossilhub
    restart: unless-stopped
    ports:
      - "6080:8080"
    volumes:
      - /vol1/1000/fossilhub:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
